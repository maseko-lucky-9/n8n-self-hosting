# Live Environment Configuration for n8n
# Runtime: Ubuntu home server, MicroK8s (single-node)
# Purpose: Production deployment

replicaCount: 1  # LIVE: Single-node cluster, no HA

namespace: n8n-live

image:
  repository: n8nio/n8n
  pullPolicy: IfNotPresent
  tag: "2.16.1@sha256:ad20607cdd24bac004ec44804b6b8ded9a2fbf92ed46c4496bf007762c883af2"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "n8n-application"  # Ensures consistent resource names regardless of Helm release name

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# LIVE: Strict security context
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true  # LIVE: Read-only root filesystem
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 80

# GAP-003: Ingress disabled — managed by homelab-infra/ingress/manifests/n8n-ingress.yaml
# The homelab-infra ingress provides TLS (homelab-tls wildcard) + nginx basic auth.
# Having two Ingress resources for the same host caused ambiguous routing.
ingress:
  enabled: false

# GAP-017: Right-sized based on 7-day baseline (actual: 9m CPU / 142Mi RAM).
# Requests give 5x CPU headroom and 1.8x RAM headroom over observed idle.
# Memory limit kept at 1Gi to cover NODE_OPTIONS --max-old-space-size=768 + overhead.
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 50m
    memory: 256Mi

# LIVE: Node.js memory tuning + Prometheus metrics
extraEnv:
  - name: NODE_OPTIONS
    value: "--max-old-space-size=768"
  - name: N8N_METRICS
    value: "true"
  # n8n 2.x: trust nginx ingress X-Forwarded-For header (1 proxy hop).
  # Without this, express-rate-limit throws ERR_ERL_UNEXPECTED_X_FORWARDED_FOR
  # on every request, blocking login with a 500 before auth runs.
  - name: N8N_PROXY_HOPS
    value: "1"
  # n8n 2.x queue mode: manual executions must run on workers, not main.
  # Without this, n8n logs a deprecation warning and manual runs bypass the queue.
  - name: OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS
    value: "true"
  # Lead pipeline config (templates/lead-to-client-pipeline). n8n Variables
  # ($vars, Settings -> Variables) are an ENTERPRISE-LICENSED feature
  # (VariablesService.canCreateNewVariable() throws FeatureNotLicensedError on
  # this Community Edition instance -- confirmed live: `n8n license:info` shows
  # isValid: false, entitlements: 0, and `SELECT count(*) FROM variables` is 0).
  # So the workflows read config from $env instead ($vars.X -> $env.X, a 1:1
  # rename -- see wf-a/b/c/d). Names below are lowercase to match the original
  # $vars keys exactly, which is the only reason they deviate from this file's
  # UPPER_SNAKE_CASE convention -- that keeps the workflow-side diff a pure
  # string substitution, auditable in one grep, rather than a second rename.
  # Non-secret values only; from_email and ntfy_topic are wired further down
  # via the (optional) lead-pipeline ExternalSecret, not here.
  - name: brand
    value: "Prudentia Digital"
  - name: site_url
    value: "https://prudentiadigital.co.za"
  - name: booking_url
    value: "https://calendly.com/prudentiadigital/automation-sprint"
  - name: followup_days
    value: "[3,7,14]"
  - name: daily_send_cap
    value: "25"
  - name: sla_hours_urgent
    value: "1"
  - name: urgent_timelines
    value: "asap"
  - name: urgent_budgets
    value: "75-150k,150k-plus"
  # from_email/ntfy_topic: same secretKeyRef shape as TELEGRAM_BOT_TOKEN
  # below, sourced from the isolated lead-pipeline ExternalSecret rather
  # than n8n-app-secret (a missing key here must never risk
  # N8N_ENCRYPTION_KEY). optional: true — unpopulated Vault path leaves
  # these unset, not a crashed pod.
  - name: from_email
    valueFrom:
      secretKeyRef:
        name: n8n-lead-pipeline-secret
        key: LEAD_FROM_EMAIL
        optional: true
  - name: ntfy_topic
    valueFrom:
      secretKeyRef:
        name: n8n-lead-pipeline-secret
        key: LEAD_NTFY_TOPIC
        optional: true
  # Reelsmith social-publish: Telegram alert credentials for failure notifications.
  # Secret created by ESO from kv/secret/n8n/live/reelsmith-telegram.
  - name: TELEGRAM_BOT_TOKEN
    valueFrom:
      secretKeyRef:
        name: reelsmith-telegram
        key: bot_token
        optional: true
  - name: TELEGRAM_CHAT_ID
    valueFrom:
      secretKeyRef:
        name: reelsmith-telegram
        key: chat_id
        optional: true
  # n8n 2.x task-runner sandbox blocks node built-ins by default.
  # Reelsmith Code nodes (Index Clips / Scan Manifests / Log Results / Archive
  # Manifest) require fs + path to read manifest CSVs, walk the inbox, append
  # log rows, and rename to processed/. Without these, every execution errors
  # with "Module 'fs' is disallowed".
  - name: NODE_FUNCTION_ALLOW_BUILTIN
    value: "fs,path,crypto"
  # n8n 2.x also blocks `$env` in every expression/Code node by default —
  # unset means every $env.X access throws ExpressionError('access to env
  # vars denied'), verified live. The lead pipeline's $vars->$env migration
  # depends on this being unblocked.
  #
  # Cost, accepted deliberately: n8n applies NO allowlist once unblocked —
  # every workflow on this shared instance (reelsmith-social-publish,
  # gtm-email-sender too) gains read access to the full container env,
  # N8N_ENCRYPTION_KEY and DB_POSTGRESDB_PASSWORD included. Accepted because
  # every workflow here is this operator's own reviewed code, not a
  # multi-tenant boundary. Revisit if that stops being true.
  - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
    value: "false"

autoscaling:
  enabled: false  # LIVE: Single-node, no autoscaling

nodeSelector: {}
tolerations: []
affinity: {}

# n8n specific configuration
n8n:
  host: "0.0.0.0"
  port: 5678
  # GAP-011: TLS terminates at nginx ingress (homelab-infra), n8n receives plain HTTP
  protocol: "http"
  # Execution pruning — prevents unbounded data growth
  executionDataMaxAge: "168"       # 7 days (in hours)
  executionDataPruneMaxCount: "50000"
  # Structured JSON logging for observability
  logLevel: "info"
  logOutput: "console,file"
  # GAP-004: External webhook callback URL (must match ingress hostname)
  webhookUrl: "https://n8n.homelab.local"

# PostgreSQL configuration
postgres:
  image:
    repository: postgres
    tag: "16-alpine@sha256:60b180625695e90b6e450405d5f0bcb74bc8c52c65d1cd11aeb3da46cac06dd8"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  persistence:
    storageClass: "microk8s-hostpath"  # LIVE: MicroK8s storage
    size: 20Gi
  # GAP-006: Postgres metrics exporter sidecar for Prometheus
  metrics:
    enabled: true
    image:
      repository: prometheuscommunity/postgres-exporter
      tag: "v0.15.0@sha256:31bdf410910646a05c7edde8d95ab771c9d78fbfbc26b50a52548707496c284d"
      pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
      requests:
        cpu: 50m  # LimitRange floor: min.cpu=50m
        memory: 32Mi

# Database connection
# LIVE: Passwords should be managed by Vault/ESO — do NOT put real passwords here
database:
  type: "postgresdb"
  host: "postgres-service"
  port: 5432
  database: "n8n"
  username: "n8n_live"
  password: "POSTGRES_NON_ROOT_PASSWORD"  # LIVE: n8n app user — replaced via ESO
  superuserPassword: "POSTGRES_PASSWORD"  # LIVE: postgres superuser — replaced via ESO
  ssl: false  # In-cluster connection via ClusterIP — SSL not needed (postgres:16-alpine has no SSL by default)

# N8N data persistence
persistence:
  enabled: true
  storageClass: "microk8s-hostpath"  # LIVE: MicroK8s storage
  accessMode: ReadWriteOnce
  size: 5Gi

# LIVE: Network isolation enabled
networkPolicy:
  enabled: true
  allowedNamespaces:
    - ingress        # MicroK8s ingress controller namespace
    - observability  # Prometheus scraping
  metricsNamespace: observability  # Namespace allowed to scrape postgres + worker metrics

# External Secrets Configuration
externalSecrets:
  enabled: true  # LIVE: Use Vault via ESO
  refreshInterval: "1h"  # How often ESO re-syncs from Vault
  vault:
    # In-cluster Vault server -- HTTPS required (Vault TLS listener)
    address: "https://vault.vault.svc.cluster.local:8200"
    kvPath: "kv"              # KV v2 mount point only (not the full secret path)
    kvVersion: "v2"
    # Full path within the KV engine where postgres creds are stored
    # Must include 'secret/' prefix to match Vault policy: kv/data/secret/n8n/+/*
    secretPath: "secret/n8n/live/postgres"
    # GAP-002/005: App-level secrets (encryption key, webhook URL)
    # Vault path: kv/<appSecretPath> → kv/secret/n8n/live/app
    appSecretPath: "secret/n8n/live/app"
    # GAP-007: Off-cluster backup credentials
    backupSecretPath: "secret/n8n/live/backup-offcluster"
    # Lead pipeline: sender mailbox + ntfy topic name (from_email, ntfy_topic).
    # Deliberately its OWN ExternalSecret/path, not folded into appSecretPath:
    # a missing key here must never risk the encryption-key/webhook-url sync
    # (that Secret is load-bearing -- losing N8N_ENCRYPTION_KEY breaks every
    # existing credential). Both env vars are wired with `optional: true`, so
    # an unpopulated or absent path leaves them simply unset, not a failed pod.
    # ntfy_topic in particular must be a random value generated ONLY here
    # (openssl rand -hex 16) -- ntfy public topics are unauthenticated in both
    # directions, so the topic name IS the access control; it must never be
    # committed to config.example.json or any template (see
    # templates/lead-to-client-pipeline/vault/secrets.md).
    leadPipelineSecretPath: "secret/n8n/live/lead-pipeline"
    # CA certificate for Vault TLS verification
    # Prereq: 'vault-tls-ca' Secret with key 'ca.crt' must exist in the namespace
    caProvider:
      type: Secret
      name: vault-tls-ca
      key: ca.crt
      namespace: n8n-live
    auth:
      mountPath: "kubernetes"             # Vault Kubernetes auth mount
      role: "n8n-readonly"                # Vault role with read-only policy on kv/data/secret/n8n/+/*
      serviceAccount: "external-secrets-n8n"  # Dedicated SA for ESO Vault auth

# LIVE: Automated backups
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: 30  # days  (dump-file retention via `find -mtime`; UNAFFECTED by the GC knobs below)
  storageSize: 10Gi
  # Job/pod GC (objects + logs only — NOT the dump files, which the script prunes
  # at `retention` days + the off-cluster rclone copy). ttl is well above the
  # N8nBackupFailed alert window (for: 0m) so failed Jobs are still observed.
  ttlSecondsAfterFinished: 86400  # delete finished backup Job pods after 24h
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  # GAP-007: Off-cluster backup via rclone to S3-compatible target.
  # Prerequisites before enabling:
  #   1. Populate Vault: vault kv put kv/secret/n8n/live/backup-offcluster \
  #        RCLONE_S3_ACCESS_KEY_ID=<key> RCLONE_S3_SECRET_ACCESS_KEY=<secret>
  #   2. Set endpoint, bucket, path below
  #   3. Set enabled: true and helm upgrade
  offCluster:
    enabled: false
    endpoint: ""      # e.g. "https://s3.us-west-002.backblazeb2.com" or "http://minio.homelab.local:9000"
    bucket: ""        # e.g. "homelab-n8n-backups"
    path: "n8n"       # path prefix within bucket
    credentialsSecret: "n8n-backup-offcluster-secret"  # created by ESO (see external-secret.yaml)
    rclone:
      image:
        repository: rclone/rclone
        tag: "1.68@sha256:41388051445353047e007aa8978ebe224a1efdd6edc55fb746656d19ddf59de2"
      resources:
        limits:
          cpu: 200m
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi

# GAP-012: Queue mode — main + worker architecture with dedicated Redis.
# Enables RollingUpdate strategy on main and horizontal worker scaling.
queue:
  enabled: true
  redis:
    image: "redis:7-alpine@sha256:4bfd9eca23339865dc14fe75f6d9ae643f714924623978dd2798f1a673b08f43"
    port: 6379
  redisResources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m  # LimitRange floor
      memory: 64Mi
  worker:
    replicas: 1
    healthPort: 5680  # n8n 2.x Task Broker occupies 5679; worker health server moved to 5680
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 50m  # LimitRange floor
        memory: 256Mi

# Init container images
initContainers:
  busybox:
    repository: busybox
    tag: "1.36@sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f"

# Namespace ResourceQuota — right-sized for live single-node cluster
resourceQuota:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "4"
    memory: 8Gi
  pods: "20"
  pvcs: "10"

# LIVE: Reelsmith social-publish — shared inbox volume
extraVolumes:
  - name: reelsmith-inbox
    persistentVolumeClaim:
      claimName: syncthing-reelsmith-pvc
extraVolumeMounts:
  - name: reelsmith-inbox
    mountPath: /data/reelsmith-inbox
    readOnly: false

# LIVE: Monitoring & Alerting
monitoring:
  enabled: true
  scrapeInterval: "30s"
  scrapeTimeout: "10s"
  additionalLabels:
    release: kube-prom-stack  # Match Prometheus Operator serviceMonitorSelector
  grafanaDashboard:
    enabled: true
    namespace: ""  # Defaults to release namespace; set to "monitoring" if Grafana is there
