name: Reelsmith dispatcher selfchecks

# Runs on a GitHub-hosted runner with no secrets and a read-only token. That
# choice does NOT protect the self-hosted runner (it holds cluster credentials):
# for pull_request events GitHub runs the workflow files from the PR's own merge
# ref, so a fork PR can add its own workflow with `runs-on: self-hosted`
# whatever this file says. The real controls are the repo setting Actions >
# General > "Require approval for all external contributors" and detaching the
# self-hosted runner from this public repo; both are owner actions listed in
# projects/reelsmith-social-publish/README.md.
on:
  pull_request:
    paths:
      - 'projects/reelsmith-social-publish/**'
      - '.github/workflows/reelsmith-selfcheck.yaml'
      - 'scripts/disclosure-sweep.sh'
      - 'scripts/disclosure-sweep.selftest.sh'

permissions:
  contents: read

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/reelsmith-social-publish/scripts
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install pinned luxon
        run: npm ci --ignore-scripts

      - name: Ensure PyYAML (manifest checks and watchdog selftest)
        run: python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-yaml; }

      - name: Run every selfcheck
        run: |
          set -e
          for f in *.selfcheck.js; do
            echo "== $f"
            node "$f"
          done

      - name: Watchdog selftest (stubbed psql/wget/date)
        run: bash watchdog.selftest.sh

      - name: Shellcheck the scripts this project owns
        run: shellcheck deploy-workflow.sh watchdog.selftest.sh ../tests/run-promtool-tests.sh ../../../scripts/disclosure-sweep.sh ../../../scripts/disclosure-sweep.selftest.sh

      - name: Disclosure sweep selftest
        run: bash ../../../scripts/disclosure-sweep.selftest.sh

  # Unit tests for the Reelsmith alert rules (manifests/reelsmith-alerts-prometheusrule.yaml).
  # The runner image ships yq (mikefarah v4, which the script insists on) and docker; promtool
  # comes from prom/prometheus:v3.10.0, the live Prometheus version, pinned by digest in the script.
  promtool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: promtool check + test rules
        run: sh projects/reelsmith-social-publish/tests/run-promtool-tests.sh
