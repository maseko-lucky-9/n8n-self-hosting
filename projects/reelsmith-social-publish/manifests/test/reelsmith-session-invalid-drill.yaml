---
# ReelsmithSessionInvalid drill: proves a critical Reelsmith alert goes from Prometheus
# through Alertmanager to Telegram, without touching the cookie. Applied by hand for a few
# minutes after the metrics-and-alerts sync (README "Deploy", step 4), then deleted; never
# synced (ArgoCD reads manifests/ non-recursively). It fires at its first evaluation
# (`vector(1)`, no `for:`), so the message arrives within about 2 minutes: one 60 s rule
# evaluation plus Alertmanager's 30 s group wait. The `drill` label keeps it apart from a
# real ReelsmithSessionInvalid, which still fires on its own if the session really dies.
#   ssh homelab 'microk8s kubectl create -f -' < manifests/test/reelsmith-session-invalid-drill.yaml
#   ssh homelab 'microk8s kubectl -n n8n-live delete prometheusrule reelsmith-session-invalid-drill'
# Checked by `promtool check rules` in tests/run-promtool-tests.sh.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: reelsmith-session-invalid-drill
  namespace: n8n-live
  labels:
    app.kubernetes.io/name: tiktok-sidecar
    app.kubernetes.io/part-of: reelsmith-social-publish
    release: kube-prom-stack
spec:
  groups:
    - name: reelsmith.drill
      rules:
        - alert: ReelsmithSessionInvalid
          expr: vector(1)
          labels:
            severity: critical
            namespace: n8n-live
            drill: "true"
          annotations:
            summary: DRILL - ReelsmithSessionInvalid, nothing is wrong
            description: >-
              DRILL, nothing is wrong: this tests that a ReelsmithSessionInvalid alert reaches
              Telegram. Delete the PrometheusRule reelsmith-session-invalid-drill in n8n-live
              once this message has arrived.
