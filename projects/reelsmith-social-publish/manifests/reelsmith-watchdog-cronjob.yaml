# Watchdog for Reelsmith Social Publish: the 15-minute dispatcher (n8n workflow
# SKLkX5qUDYLlWTxo, 12:00-20:45 SAST) and the tiktok-sidecar gatekeeper. It is the
# Mac-asleep backstop: the homelab desk (OpenClaw, on the Mac) watches the workflow
# too, but nothing in the cluster reads n8n's execution state except this job.
#
# The runs are not upload slots. 09:45 probes the session before the first slot
# (12:00), so a dead cookie is reported before that slot spends an attempt on it;
# 12:45, 15:45 and 18:45 follow the slots (12:00, 15:00, 18:00); 21:45 follows the
# last dispatcher tick (20:45). It reads execution_entity directly (independent of
# n8n's own health) and asks the sidecar for its state.
#
# Checks (every Telegram message carries only fixed strings, validated integers
# and the workflow id; everything else is stripped, see clean()):
#  a. failed executions (status error/crashed/canceled; an execution timeout
#     may be recorded as canceled) in the last 4h. Reported on EVERY run. The
#     09:45 run looks back 13h (to 20:45, the last dispatcher tick), overlapping
#     the 21:45 run's window, so nothing from the previous evening is missed.
#  b. GET /healthz/session, on the 09:45 run only (so at most once a day):
#     401 => "cookie expired - run make refresh-cookies"; 503 => no cookie on the
#     sidecar; 502 => "sidecar cannot reach TikTok"; no answer (refused, timeout)
#     => "sidecar down"; any other status => "sidecar session check failed".
# Dropped on 2026-10-28 (ADR-0002 amendment; the desk owns them): the "no executions
# in 25h" check, the /api/stats checks (no success for 48h, paused, stats unreadable)
# and the daily digest list. One run sends at most one message.
#
# TEST_ALERT=1 sends exactly one test message and exits 0 (see
# ../test/reelsmith-watchdog-test-alert-job.yaml). A failed send exits 1 and
# prints only the HTTP status, never the URL (it contains the bot token).
#
# Self-test: ../scripts/watchdog.selftest.sh runs this script against stub psql
# and wget. Keep the Job copy of the script identical (the self-test checks it).
#
# Secrets (NEVER in git):
#  - reelsmith-watchdog-db / password  -> read-only role n8n_watchdog (SELECT on
#    execution_entity only). Created out-of-band; to re-create it, generate the
#    password on the homelab and keep it off argv (stdin only):
#      PW=$(openssl rand -hex 24)
#      printf "DO \$do\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='n8n_watchdog') THEN CREATE ROLE n8n_watchdog LOGIN; END IF; END \$do\$;\nALTER ROLE n8n_watchdog LOGIN PASSWORD '%s';\nGRANT CONNECT ON DATABASE n8n TO n8n_watchdog; GRANT USAGE ON SCHEMA public TO n8n_watchdog; GRANT SELECT ON execution_entity TO n8n_watchdog;\n" "$PW" \
#        | kubectl exec -i -n n8n-live <pg-pod> -c postgres -- psql -U postgres -d n8n -v ON_ERROR_STOP=1 -f -
#      printf '%s' "$PW" | kubectl create secret generic reelsmith-watchdog-db -n n8n-live --from-file=password=/dev/stdin
#    ponytail: a direct k8s Secret, not ESO/Vault-managed like the others here.
#      Trivially re-creatable read-only cred; promote to an ExternalSecret if it
#      ever needs to survive a namespace rebuild unattended.
#  - reelsmith-telegram / bot_token, chat_id  -> existing ESO-synced alert creds.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reelsmith-publish-watchdog
  namespace: n8n-live
  labels:
    app.kubernetes.io/part-of: reelsmith-social-publish
    app.kubernetes.io/component: reelsmith-watchdog
spec:
  # Switched on 2026-10-24: six uploads failed in a row with no alert while this
  # was suspended. Set back to true only while the workflow is deactivated.
  suspend: false
  timeZone: Africa/Johannesburg
  schedule: "45 9,12,15,18,21 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600   # don't fire a stale missed run after a host-off
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            # UNIQUE label: matches no egress policy => open egress (Telegram),
            # and is the source the reelsmith-watchdog-to-postgres and
            # n8n-to-tiktok-sidecar policies allow.
            app.kubernetes.io/component: reelsmith-watchdog
            app.kubernetes.io/part-of: reelsmith-social-publish
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70    # the image's postgres user
            runAsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watchdog
              # Ships psql and busybox wget; nothing is installed at runtime.
              # Pinned by digest (the multi-arch index of 16-alpine on 2026-10-24).
              image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: reelsmith-watchdog-db, key: password }
                - name: TG_TOKEN
                  valueFrom:
                    secretKeyRef: { name: reelsmith-telegram, key: bot_token }
                - name: TG_CHAT
                  valueFrom:
                    secretKeyRef: { name: reelsmith-telegram, key: chat_id }
                - name: WF_ID
                  value: "SKLkX5qUDYLlWTxo"
                # Short in-cluster name, resolved through the pod's DNS search path.
                - name: SIDECAR_URL
                  value: "http://tiktok-sidecar.n8n-live.svc:8000"
                - name: ACCOUNT
                  value: "reelsmith"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  export LC_ALL=C
                  DIGEST_HOUR=09   # the 09:45 run also probes the sidecar and looks back further; zero-padded like date +%H

                  log() { printf '%s\n' "$*"; }
                  die() { log "FATAL: $*"; exit 1; }
                  # valid VALUE CHARS ERE: VALUE is non-empty, uses only the bracket-class
                  # CHARS (so never a newline) and matches ERE in full.
                  valid() { case $1 in ''|*[!$2]*) return 1 ;; esac; printf '%s\n' "$1" | grep -Eqx -e "$3"; }
                  is_int() { valid "$1" 0-9 '[0-9]{1,9}'; }
                  # HTTP status from busybox wget's error text ("server returned
                  # error: HTTP/1.1 401 ..."); 000 = no HTTP answer at all.
                  status_of() {
                    s=$(printf '%s\n' "$1" | sed -n 's/.*HTTP\/[0-9.]* \([0-9][0-9][0-9]\).*/\1/p' | tail -n 1)
                    if is_int "$s"; then printf '%s' "$s"; else printf '000'; fi
                  }
                  # fetch URL: sets STATUS (200 on success) and BODY (empty on failure). Prints nothing.
                  fetch() {
                    if BODY=$(wget -q -T 10 -O - "$1" 2>&1); then STATUS=200; return; fi
                    STATUS=$(status_of "$BODY"); BODY=
                  }
                  # Allowlist: quotes, newlines and every other character are dropped.
                  clean() { printf '%s' "$1" | tr -cd 'A-Za-z0-9 .,;:()/_-' | cut -c1-1000; }
                  send() {
                    text=$(clean "$1")
                    enc=$(printf '%s' "$text" | sed -e 's/ /%20/g' -e 's/,/%2C/g' -e 's/;/%3B/g' -e 's/:/%3A/g' -e 's/(/%28/g' -e 's/)/%29/g' -e 's/\//%2F/g')
                    # Accepted tradeoff: busybox wget takes the token in its argv, and
                    # /proc/<pid>/cmdline of a container process is readable by any user
                    # on the node (environ is not) for the few seconds of the call. Fine on
                    # this single-user node. The fix is an image that ships curl (token on
                    # stdin via -K -), deferred: installing curl at runtime is what made the
                    # old watchdog miss its deadline.
                    if out=$(wget -q -T 10 -O /dev/null --post-data "chat_id=${TG_CHAT}&text=${enc}" \
                        "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" 2>&1); then
                      log "alert sent: $text"
                    else
                      die "telegram send failed (HTTP $(status_of "$out"))"
                    fi
                  }

                  valid "${TG_TOKEN:-}" '0-9A-Za-z:_-' '[0-9]+:[A-Za-z0-9_-]+' || die "TG_TOKEN is missing or malformed"
                  valid "${TG_CHAT:-}" '0-9-' '-?[0-9]+' || die "TG_CHAT is missing or not a numeric chat id"

                  if [ "${TEST_ALERT:-0}" = 1 ]; then
                    send "Reelsmith watchdog: test alert, Telegram delivery works"
                    exit 0
                  fi

                  valid "${WF_ID:-}" 'A-Za-z0-9' '[A-Za-z0-9]{1,32}' || die "WF_ID is missing or malformed"
                  valid "${ACCOUNT:-}" 'a-z0-9_-' '[a-z0-9_-]{1,32}' || die "ACCOUNT is missing or malformed"
                  valid "${SIDECAR_URL:-}" 'A-Za-z0-9.:/-' 'http://[A-Za-z0-9.-]+:[0-9]{1,5}' || die "SIDECAR_URL is missing or malformed"

                  HOUR=$(TZ=SAST-2 date +%H)   # SAST is UTC+2 all year; the POSIX form needs no tzdata
                  DIGEST=0; [ "$HOUR" = "$DIGEST_HOUR" ] && DIGEST=1
                  LOOKBACK=4; [ "$DIGEST" = 1 ] && LOOKBACK=13
                  NOW_ITEMS=; DAY_ITEMS=
                  add_now() { NOW_ITEMS="${NOW_ITEMS:+$NOW_ITEMS; }$1"; }
                  add_day() { DAY_ITEMS="${DAY_ITEMS:+$DAY_ITEMS; }$1"; }

                  # (a) failed executions in the lookback window. Nothing else in the cluster reads n8n's
                  # execution state, so this check stays on every run.
                  export PGCONNECT_TIMEOUT=10 PGOPTIONS='-c statement_timeout=10000'
                  RES=$(psql -X -h postgres-service -U n8n_watchdog -d n8n -tA -c \
                    "SELECT count(*) FILTER (WHERE status IN ('error','crashed','canceled')) \
                     ||'|'|| COALESCE((max(id) FILTER (WHERE status IN ('error','crashed','canceled')))::text, '0') \
                     FROM execution_entity WHERE \"workflowId\"='$WF_ID' AND \"startedAt\" > now() - interval '$LOOKBACK hours';")
                  if valid "$RES" '0-9|' '[0-9]{1,9}\|[0-9]{1,12}'; then
                    ERRS=${RES%%|*}; LAST_ID=${RES#*|}
                    [ "$ERRS" -gt 0 ] && add_now "$ERRS failed execution(s) of workflow $WF_ID in the last ${LOOKBACK}h, latest id $LAST_ID"
                    log "hour=$HOUR lookback=${LOOKBACK}h failed=$ERRS"
                  else
                    add_now "n8n database query failed"
                    log "hour=$HOUR database query failed"
                  fi

                  if [ "$DIGEST" = 1 ]; then
                    # (b) the sidecar is down, or the TikTok cookie is invalid: the once-a-day backstop for
                    # the Mac-asleep case. The sidecar caches the probe (no forced refresh).
                    fetch "$SIDECAR_URL/healthz/session?account=$ACCOUNT"
                    case $STATUS in
                      200) ;;
                      401) add_day "cookie expired - run make refresh-cookies" ;;
                      502) add_day "sidecar cannot reach TikTok (session check HTTP 502)" ;;
                      503) add_day "no cookie on the sidecar - run make refresh-cookies (session check HTTP 503)" ;;
                      000) add_day "sidecar down (session check HTTP 000)" ;;
                      *) add_day "sidecar session check failed (HTTP $STATUS)" ;;
                    esac
                    log "session=$STATUS"
                  fi

                  MSG=$NOW_ITEMS
                  if [ "$DIGEST" = 1 ] && [ -n "$DAY_ITEMS" ]; then MSG="${MSG:+$MSG; }daily: $DAY_ITEMS"; fi
                  if [ -z "$MSG" ]; then log "ok: no alert"; exit 0; fi
                  send "Reelsmith watchdog: $MSG"
              resources:
                requests: { cpu: 50m, memory: 64Mi }   # namespace LimitRange min cpu = 50m
                limits: { cpu: 200m, memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
