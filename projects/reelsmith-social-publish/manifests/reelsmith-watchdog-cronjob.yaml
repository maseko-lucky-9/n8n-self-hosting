# Watchdog for Reelsmith Social Publish: the Mac-asleep backstop. The homelab desk
# (OpenClaw, runs on the Mac) watches the whole publish workflow; this CronJob keeps
# only the two faults that must still reach the owner while the Mac is asleep, one
# check once a day at 09:45 SAST (ADR-0002, amendment 2026-10-28; plan section A2b):
#  - the tiktok-sidecar does not answer or is unhealthy => "sidecar down" /
#    "sidecar session check failed";
#  - the TikTok cookie is invalid => "cookie expired - run make refresh-cookies"
#    (401), or "no cookie on the sidecar" (503).
# It asks GET /healthz/session (the sidecar caches it; no forced refresh). A 502 (the
# sidecar is up but cannot reach TikTok) is not a cookie fault and stays silent.
# Dropped, because the desk owns them: failed executions of the workflow, "no
# executions in 25h", no success for 48h, a paused sidecar, and the per-slot runs.
# One run sends at most one message; every message carries only fixed strings, validated
# integers and the sidecar's HTTP status (everything else is stripped, see clean()).
#
# TEST_ALERT=1 sends exactly one test message and exits 0 (see
# ../test/reelsmith-watchdog-test-alert-job.yaml). A failed send exits 1 and
# prints only the HTTP status, never the URL (it contains the bot token).
#
# Self-test: ../scripts/watchdog.selftest.sh runs this script against a stub wget.
# Keep the Job copy of the script identical (the self-test checks it).
#
# Secrets (NEVER in git):
#  - reelsmith-telegram / bot_token, chat_id  -> existing ESO-synced alert creds.
# No longer used here: the read-only Postgres role n8n_watchdog and the
# reelsmith-watchdog-db Secret (and the reelsmith-watchdog-to-postgres NetworkPolicy)
# from when this job read execution_entity. They are left in place; retire them in a
# separate change.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reelsmith-publish-watchdog
  namespace: n8n-live
  labels:
    app.kubernetes.io/part-of: reelsmith-social-publish
    app.kubernetes.io/component: reelsmith-watchdog
spec:
  # Switched on 2026-10-24: six uploads failed in a row with no alert while this
  # was suspended. Set back to true only while the sidecar is deliberately down.
  suspend: false
  timeZone: Africa/Johannesburg
  schedule: "45 9 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600   # don't fire a stale missed run after a host-off
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            # UNIQUE label: matches no egress policy => open egress (Telegram),
            # and is the source the reelsmith-watchdog-to-postgres and
            # n8n-to-tiktok-sidecar policies allow.
            app.kubernetes.io/component: reelsmith-watchdog
            app.kubernetes.io/part-of: reelsmith-social-publish
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70    # the image's postgres user
            runAsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watchdog
              # Ships busybox wget; nothing is installed at runtime (the image is kept so its
              # digest does not change; it no longer needs psql).
              # Pinned by digest (the multi-arch index of 16-alpine on 2026-10-24).
              image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
              env:
                - name: TG_TOKEN
                  valueFrom:
                    secretKeyRef: { name: reelsmith-telegram, key: bot_token }
                - name: TG_CHAT
                  valueFrom:
                    secretKeyRef: { name: reelsmith-telegram, key: chat_id }
                # Short in-cluster name, resolved through the pod's DNS search path.
                - name: SIDECAR_URL
                  value: "http://tiktok-sidecar.n8n-live.svc:8000"
                - name: ACCOUNT
                  value: "reelsmith"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  export LC_ALL=C

                  log() { printf '%s\n' "$*"; }
                  die() { log "FATAL: $*"; exit 1; }
                  # valid VALUE CHARS ERE: VALUE is non-empty, uses only the bracket-class
                  # CHARS (so never a newline) and matches ERE in full.
                  valid() { case $1 in ''|*[!$2]*) return 1 ;; esac; printf '%s\n' "$1" | grep -Eqx -e "$3"; }
                  is_int() { valid "$1" 0-9 '[0-9]{1,9}'; }
                  # HTTP status from busybox wget's error text ("server returned
                  # error: HTTP/1.1 401 ..."); 000 = no HTTP answer at all.
                  status_of() {
                    s=$(printf '%s\n' "$1" | sed -n 's/.*HTTP\/[0-9.]* \([0-9][0-9][0-9]\).*/\1/p' | tail -n 1)
                    if is_int "$s"; then printf '%s' "$s"; else printf '000'; fi
                  }
                  # fetch URL: sets STATUS (200 on success) and BODY (empty on failure). Prints nothing.
                  fetch() {
                    if BODY=$(wget -q -T 10 -O - "$1" 2>&1); then STATUS=200; return; fi
                    STATUS=$(status_of "$BODY"); BODY=
                  }
                  # Allowlist: quotes, newlines and every other character are dropped.
                  clean() { printf '%s' "$1" | tr -cd 'A-Za-z0-9 .,;:()/_-' | cut -c1-1000; }
                  send() {
                    text=$(clean "$1")
                    enc=$(printf '%s' "$text" | sed -e 's/ /%20/g' -e 's/,/%2C/g' -e 's/;/%3B/g' -e 's/:/%3A/g' -e 's/(/%28/g' -e 's/)/%29/g' -e 's/\//%2F/g')
                    # Accepted tradeoff: busybox wget takes the token in its argv, and
                    # /proc/<pid>/cmdline of a container process is readable by any user
                    # on the node (environ is not) for the few seconds of the call. Fine on
                    # this single-user node. The fix is an image that ships curl (token on
                    # stdin via -K -), deferred: installing curl at runtime is what made the
                    # old watchdog miss its deadline.
                    if out=$(wget -q -T 10 -O /dev/null --post-data "chat_id=${TG_CHAT}&text=${enc}" \
                        "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" 2>&1); then
                      log "alert sent: $text"
                    else
                      die "telegram send failed (HTTP $(status_of "$out"))"
                    fi
                  }

                  valid "${TG_TOKEN:-}" '0-9A-Za-z:_-' '[0-9]+:[A-Za-z0-9_-]+' || die "TG_TOKEN is missing or malformed"
                  valid "${TG_CHAT:-}" '0-9-' '-?[0-9]+' || die "TG_CHAT is missing or not a numeric chat id"

                  if [ "${TEST_ALERT:-0}" = 1 ]; then
                    send "Reelsmith watchdog: test alert, Telegram delivery works"
                    exit 0
                  fi

                  valid "${ACCOUNT:-}" 'a-z0-9_-' '[a-z0-9_-]{1,32}' || die "ACCOUNT is missing or malformed"
                  valid "${SIDECAR_URL:-}" 'A-Za-z0-9.:/-' 'http://[A-Za-z0-9.-]+:[0-9]{1,5}' || die "SIDECAR_URL is missing or malformed"

                  ITEMS=
                  add() { ITEMS="${ITEMS:+$ITEMS; }$1"; }

                  # Only the two faults the homelab desk cannot report when the Mac is asleep: the
                  # sidecar is down, or the TikTok cookie is invalid. The probe is the sidecar's
                  # cached session check (no forced refresh). Everything else (failed executions,
                  # stale or paused posting, TikTok refusals) is watched by the desk.
                  fetch "$SIDECAR_URL/healthz/session?account=$ACCOUNT"
                  case $STATUS in
                    200) ;;
                    401) add "cookie expired - run make refresh-cookies" ;;
                    503) add "no cookie on the sidecar - run make refresh-cookies (session check HTTP 503)" ;;
                    000) add "sidecar down (session check HTTP 000)" ;;
                    502) ;;   # the sidecar is up but cannot reach TikTok: not a cookie fault, the desk covers it
                    *) add "sidecar session check failed (HTTP $STATUS)" ;;
                  esac
                  log "session=$STATUS"

                  if [ -z "$ITEMS" ]; then log "ok: no alert"; exit 0; fi
                  send "Reelsmith watchdog: $ITEMS"
              resources:
                requests: { cpu: 50m, memory: 64Mi }   # namespace LimitRange min cpu = 50m
                limits: { cpu: 200m, memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
