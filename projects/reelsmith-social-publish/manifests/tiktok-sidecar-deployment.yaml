---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiktok-sidecar
  namespace: n8n-live
  labels:
    app.kubernetes.io/name: tiktok-sidecar
    app.kubernetes.io/part-of: reelsmith-social-publish
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tiktok-sidecar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tiktok-sidecar
        app.kubernetes.io/part-of: reelsmith-social-publish
    spec:
      # initContainer (re)seeds CookiesDir from the out-of-band Secret on EVERY
      # pod start, overwriting any existing PVC copy whenever the Secret has
      # cookies. This makes the documented refresh flow actually work: update
      # the Secret, then `kubectl rollout restart deploy/tiktok-sidecar`, and
      # the new cookie takes effect. (Previously it skipped when the PVC was
      # non-empty, so a refreshed Secret never reached a populated PVC — a
      # stale-cookie trap that silently kept failed auth.) If the Secret is
      # empty it leaves the PVC untouched, so it never wipes a working cookie.
      initContainers:
        - name: seed-cookies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              if ls /secrets/*.cookie >/dev/null 2>&1; then
                echo "seed-cookies: (re)seeding cookies from /secrets to /app/CookiesDir"
                cp -vf /secrets/*.cookie /app/CookiesDir/
              else
                echo "seed-cookies: no .cookie files in /secrets — leaving existing PVC contents untouched"
                ls -la /app/CookiesDir || true
              fi
          volumeMounts:
            - name: cookies-pvc
              mountPath: /app/CookiesDir
            - name: cookies-secret
              mountPath: /secrets
              readOnly: true
      containers:
        - name: tiktok-sidecar
          image: localhost:32000/reelsmith/tiktok-sidecar:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MOCK_UPLOAD
              value: "false"
            - name: COOKIES_DIR
              value: /app/CookiesDir
            - name: UPLOADER_PATH
              value: /opt/uploader/cli.py
          volumeMounts:
            - name: cookies-pvc
              mountPath: /app/CookiesDir
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              # Bumped 512Mi -> 1Gi: the uploader launches headless Chromium
              # (Playwright) + Node + Python + the video buffer, which can
              # exceed 512Mi and OOMKill mid-upload (no upload ever reached
              # this far before the luxon fix, so OOM was latent).
              cpu: 750m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: cookies-pvc
          persistentVolumeClaim:
            claimName: tiktok-sidecar-cookies-pvc
        - name: cookies-secret
          secret:
            secretName: tiktok-sidecar-cookies
            optional: true
            defaultMode: 0400
