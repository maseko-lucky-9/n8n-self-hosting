---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiktok-sidecar
  namespace: n8n-live
  labels:
    app.kubernetes.io/name: tiktok-sidecar
    app.kubernetes.io/part-of: reelsmith-social-publish
spec:
  # ONE pod, replaced with Recreate, never RollingUpdate (watchdog.selftest.sh
  # checks both). The sidecar is the single gatekeeper: its upload lock lives in
  # one process. During a rolling update two pods would serve at once with
  # separate locks, and the new pod's startup recovery would mark the old pod's
  # in-flight upload `interrupted`. Both PVCs it mounts (cookies + ledger, and
  # the inbox) are ReadWriteOnce. On this single node that still lets pods share
  # them; on more than one node a surge pod could not attach them, and a
  # rolling update would hang.
  # Cost of Recreate: every restart (a sync, `make refresh-cookies`) is a short
  # outage, and n8n treats it as retryable. A restart DURING an upload kills it
  # after the 30 s grace period. That clip is then `interrupted` (ambiguous:
  # resolve it with `make ledger-resolve`), so restart outside the ~15 minutes
  # after a posting slot.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tiktok-sidecar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tiktok-sidecar
        app.kubernetes.io/part-of: reelsmith-social-publish
    spec:
      # The sidecar never talks to the Kubernetes API.
      automountServiceAccountToken: false
      # uid/gid 10001 is baked into the image (Dockerfile USER). fsGroup makes the
      # mounted Secret's files group-owned by 10001, so the cookie Secret's 0440 mode
      # lets the non-root seed-cookies container read it. fsGroup does NOT chown the
      # hostpath cookies PVC: its ownership was handed to 10001 once, with
      # manifests/test/tiktok-sidecar-chown-cookies-job.yaml (README "Run as non-root").
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # initContainer (re)seeds CookiesDir from the out-of-band Secret on EVERY
      # pod start, overwriting any existing PVC copy whenever the Secret has
      # cookies. This makes the documented refresh flow actually work: update
      # the Secret, then `kubectl rollout restart deploy/tiktok-sidecar`, and
      # the new cookie takes effect. (Previously it skipped when the PVC was
      # non-empty, so a refreshed Secret never reached a populated PVC — a
      # stale-cookie trap that silently kept failed auth.) If the Secret is
      # empty it leaves the PVC untouched, so it never wipes a working cookie.
      # It also locks CookiesDir to 0700: the cookie and the posting ledger
      # (ledger.jsonl) live there.
      initContainers:
        - name: seed-cookies
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - sh
            - -c
            - |
              set -e
              if ls /secrets/*.cookie >/dev/null 2>&1; then
                echo "seed-cookies: (re)seeding cookies from /secrets to /app/CookiesDir"
                cp -vf /secrets/*.cookie /app/CookiesDir/
              else
                echo "seed-cookies: no .cookie files in /secrets — leaving existing PVC contents untouched"
                ls -la /app/CookiesDir || true
              fi
              chmod 0700 /app/CookiesDir
          # Runs as uid 10001 (the pod's runAsUser) with no capabilities. That is
          # enough because 10001 owns CookiesDir and everything in it: it reads the
          # Secret through the fsGroup (mode 0440), replaces a 0400 cookie (cp -f
          # unlinks and recreates, which needs only write access to the directory)
          # and chmods its own dir. If CookiesDir were ever owned by another uid this
          # fails closed (the pod stays in Init) and the fix is the one-off chown job,
          # not a capability.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: cookies-pvc
              mountPath: /app/CookiesDir
            - name: cookies-secret
              mountPath: /secrets
              readOnly: true
      containers:
        - name: tiktok-sidecar
          # Pinned by digest (go-live step 2). The in-cluster registry has no auth, so
          # any pod that reaches it could push a different :0.4.0. This is the 0.4.0
          # image built from tiktok-sidecar ee8f504 (linux/amd64 plus BuildKit's
          # provenance entry). To ship a new version: `make remote-ship TAG=<new>` in
          # tiktok-sidecar, read the digest from the registry, and change this line in a PR.
          image: localhost:32000/reelsmith/tiktok-sidecar@sha256:0f0cddada0abb51c4fe6126c645088bdd49ac5ecc125bc302debbb7a56a045be
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MOCK_UPLOAD
              value: "false"
            - name: COOKIES_DIR
              value: /app/CookiesDir
            - name: UPLOADER_PATH
              value: /opt/uploader/cli.py
            # Kill switch. "true" since go-live (runbook step 7). Posting still needs the
            # workflow to be PUBLISHED (only `deploy-workflow.sh --live` does that).
            # Rollback: set "false" and sync; every upload request is a dry run again.
            - name: POSTING_ENABLED
              value: "true"
            # Posts per Africa/Johannesburg calendar day.
            - name: DAILY_CAP
              value: "3"
            # Upload attempts that reach the uploader, per day.
            - name: ATTEMPT_CAP
              value: "6"
            - name: MAX_CLIP_MB
              value: "300"
            # clip_path from n8n is <job>/<filename>, resolved under INBOX_DIR.
            - name: INBOX_DIR
              value: /inbox
            - name: LEDGER_PATH
              value: /app/CookiesDir/ledger.jsonl
          volumeMounts:
            - name: cookies-pvc
              mountPath: /app/CookiesDir
            # The Syncthing share only (subPath), read-only: Syncthing's keys
            # and config at the PVC root stay invisible to the sidecar.
            - name: reelsmith-inbox
              mountPath: /inbox
              subPath: reelsmith-inbox
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              # 1.5Gi: the uploader launches headless Chromium (Playwright) +
              # Node + Python and buffers the clip; backlog clips reach 248 MB
              # and MAX_CLIP_MB allows 300.
              cpu: 750m
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: cookies-pvc
          persistentVolumeClaim:
            claimName: tiktok-sidecar-cookies-pvc
        - name: cookies-secret
          secret:
            secretName: tiktok-sidecar-cookies
            optional: true
            defaultMode: 0440
        - name: reelsmith-inbox
          persistentVolumeClaim:
            claimName: syncthing-reelsmith-pvc
            readOnly: true
