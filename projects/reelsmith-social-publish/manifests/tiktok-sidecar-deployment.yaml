---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiktok-sidecar
  namespace: n8n-live
  labels:
    app.kubernetes.io/name: tiktok-sidecar
    app.kubernetes.io/part-of: reelsmith-social-publish
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tiktok-sidecar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tiktok-sidecar
        app.kubernetes.io/part-of: reelsmith-social-publish
    spec:
      # initContainer seeds CookiesDir from the out-of-band Secret on first
      # pod start (and on every rollout restart). Cookies must be refreshed
      # via `kubectl rollout restart deploy/tiktok-sidecar` after a Secret
      # update — NEVER `kubectl delete pod` (ArgoCD selfHeal recreates it
      # before the initContainer re-runs).
      initContainers:
        - name: seed-cookies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              if [ -z "$(ls -A /app/CookiesDir 2>/dev/null)" ]; then
                echo "seed-cookies: copying cookies from /secrets to /app/CookiesDir"
                cp -v /secrets/*.cookie /app/CookiesDir/ 2>/dev/null || \
                  echo "seed-cookies: no .cookie files in /secrets (Secret may be empty until operator bootstraps)"
              else
                echo "seed-cookies: /app/CookiesDir already populated, skipping"
                ls -la /app/CookiesDir
              fi
          volumeMounts:
            - name: cookies-pvc
              mountPath: /app/CookiesDir
            - name: cookies-secret
              mountPath: /secrets
              readOnly: true
      containers:
        - name: tiktok-sidecar
          image: localhost:32000/reelsmith/tiktok-sidecar:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MOCK_UPLOAD
              value: "false"
            - name: COOKIES_DIR
              value: /app/CookiesDir
            - name: UPLOADER_PATH
              value: /opt/uploader/cli.py
          volumeMounts:
            - name: cookies-pvc
              mountPath: /app/CookiesDir
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: cookies-pvc
          persistentVolumeClaim:
            claimName: tiktok-sidecar-cookies-pvc
        - name: cookies-secret
          secret:
            secretName: tiktok-sidecar-cookies
            optional: true
            defaultMode: 0400
