---
apiVersion: v1
kind: Service
metadata:
  name: tiktok-sidecar
  namespace: n8n-live
  labels:
    app.kubernetes.io/name: tiktok-sidecar
    app.kubernetes.io/part-of: reelsmith-social-publish
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tiktok-sidecar
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    # Scraped by Prometheus through tiktok-sidecar-servicemonitor.yaml (it names
    # this port). Only Prometheus may reach it: see the NetworkPolicy
    # prometheus-to-tiktok-sidecar-metrics.
    - name: metrics
      port: 9100
      targetPort: 9100
      protocol: TCP
